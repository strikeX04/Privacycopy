<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>VipMenu 30s</title>
<style>
  html, body { margin: 0; background: #111; height: 100%; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===================== CONFIGURAÇÃO =====================
// placeholders: true mostra as etiquetas amarelas de "tela ilustrativa". Troque para false na versão final com prints reais.
const CONFIG = { largura: 1080, altura: 1920, fps: 30, duracao: 30, bpm: 112, semente: 11, placeholders: true };
const COR = {
  fundo: '#09090b', azul1: '#1d6cf7', azul2: '#0da8ff', branco: '#ffffff', cinza: '#8b93a3',
  ouro: '#ffc83d', ouroEsc: '#e79b00', tela: '#f4f6fb', texto: '#11141b', verde: '#25d366', escuro: '#0f1218',
};
// Textos da tela. Mude aqui sem mexer nas cenas.
const TXT = {
  restaurante: 'Seu Restaurante',
  cta: 'Conheça o VipMenu',
  numero: '(11) 9••••-••42',
};

// ===================== AJUDANTES =====================
function rng(semente) { let a = semente >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const limita = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mistura = (a, b, p) => a + (b - a) * p;
const progresso = (t, ini, dur) => limita((t - ini) / dur);
const suave = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const sai = (p) => 1 - Math.pow(1 - p, 3);
const entra = (p) => p * p * p;
const salto = (p) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const L = CONFIG.largura, A = CONFIG.altura;
const SW = 392, SH = 842; // tela do celular, em pontos

const F = (peso, tam) => peso + ' ' + tam + 'px Inter, system-ui, sans-serif';
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function gradAzul(ctx, x0, y0, x1, y1) { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, COR.azul1); g.addColorStop(1, COR.azul2); return g; }
function txt(ctx, s, x, y, peso, tam, cor, alinha = 'left') {
  ctx.font = F(peso, tam); ctx.fillStyle = cor; ctx.textAlign = alinha; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function circulo(ctx, x, y, r, cor) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = cor; ctx.fill(); }
function estrela(ctx, x, y, r, cor) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  ctx.closePath(); ctx.fillStyle = cor; ctx.fill();
}
function check(ctx, x, y, s, cor, lw, p = 1) {
  ctx.save(); ctx.strokeStyle = cor; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pts = [[-0.5, 0], [-0.15, 0.35], [0.55, -0.4]];
  const d1 = Math.hypot(0.35, 0.35), d2 = Math.hypot(0.7, 0.75), tot = d1 + d2, alvo = tot * p;
  ctx.beginPath(); ctx.moveTo(x + pts[0][0] * s, y + pts[0][1] * s);
  if (alvo <= d1) { const q = alvo / d1; ctx.lineTo(x + mistura(pts[0][0], pts[1][0], q) * s, y + mistura(pts[0][1], pts[1][1], q) * s); }
  else { ctx.lineTo(x + pts[1][0] * s, y + pts[1][1] * s); const q = (alvo - d1) / d2; ctx.lineTo(x + mistura(pts[1][0], pts[2][0], q) * s, y + mistura(pts[1][1], pts[2][1], q) * s); }
  ctx.stroke(); ctx.restore();
}
function iconeWhats(ctx, x, y, r) {
  circulo(ctx, x, y, r, COR.verde);
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.16; ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - r * 0.42, y + r * 0.38); ctx.lineTo(x - r * 0.6, y + r * 0.62); ctx.lineTo(x - r * 0.18, y + r * 0.52); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
}
function cadeado(ctx, x, y, s, cor) {
  ctx.save(); ctx.strokeStyle = cor; ctx.fillStyle = cor; ctx.lineWidth = s * 0.16;
  ctx.beginPath(); ctx.arc(x, y - s * 0.15, s * 0.3, Math.PI, 0); ctx.stroke();
  rr(ctx, x - s * 0.45, y - s * 0.15, s * 0.9, s * 0.65, s * 0.12); ctx.fill(); ctx.restore();
}

// manchete em linhas; cada linha é uma lista de [texto, estilo] com estilo 'w' branco, 'b' azul, 'g' dourado
function manchete(ctx, linhas, y, tam, t, ini, fim) {
  ctx.save();
  let size = tam; ctx.font = F(800, size);
  const larg = (l) => l.reduce((s, [tx]) => s + ctx.measureText(tx).width, 0);
  const maxw = Math.max(...linhas.map(larg));
  if (maxw > 930) { size = tam * 930 / maxw; ctx.font = F(800, size); }
  linhas.forEach((l, i) => {
    const pe = sai(progresso(t, ini + i * 0.14, 0.4)), ps = suave(progresso(t, fim - 0.3, 0.3));
    if (pe <= 0 || ps >= 1) return;
    const w = larg(l); let x = L / 2 - w / 2; const yy = y + i * size * 1.14 + (1 - pe) * 46 - ps * 36;
    ctx.globalAlpha = pe * (1 - ps);
    l.forEach(([tx, est]) => {
      const wt = ctx.measureText(tx).width;
      ctx.fillStyle = est === 'b' ? gradAzul(ctx, x, 0, x + wt, 0) : est === 'g' ? COR.ouro : '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 28; ctx.shadowOffsetY = 6;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(tx, x, yy); x += wt;
    });
  });
  ctx.restore();
}

function etiqueta(ctx, s, x = L / 2, y = 1700) {
  if (!CONFIG.placeholders) return;
  ctx.save(); ctx.font = F(800, 26); const w = ctx.measureText(s).width + 44;
  ctx.globalAlpha = 0.95; rr(ctx, x - w / 2, y - 24, w, 48, 24); ctx.fillStyle = '#ffd60a'; ctx.fill();
  txt(ctx, s, x, y + 1, 800, 26, '#111', 'center'); ctx.restore();
}

// ===================== FUNDOS =====================
function fundoMarca(ctx, t, forca = 1) {
  ctx.fillStyle = COR.fundo; ctx.fillRect(0, 0, L, A);
  const bolhas = [[0.2, 0.25, 700, COR.azul1, 0.5], [0.85, 0.7, 800, COR.azul2, 0.35], [0.5, 1.0, 900, COR.azul1, 0.3]];
  bolhas.forEach(([bx, by, r, c, a], i) => {
    const x = bx * L + Math.sin(t * 0.6 + i * 2) * 80, y = by * A + Math.cos(t * 0.5 + i) * 90;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c + '55'); g.addColorStop(1, c + '00');
    ctx.globalAlpha = a * forca; ctx.fillStyle = g; ctx.fillRect(0, 0, L, A);
  });
  ctx.globalAlpha = 0.08 * forca; ctx.fillStyle = '#fff';
  for (let gx = 60; gx < L; gx += 60) for (let gy = 60; gy < A; gy += 60) ctx.fillRect(gx, gy, 2, 2);
  ctx.globalAlpha = 1;
}
function particulas(ctx, t, n, semente, cor, forca = 1) {
  const r = rng(semente);
  for (let i = 0; i < n; i++) {
    const x0 = r() * L, v = 30 + r() * 90, s = 2 + r() * 5, fase = r() * 10;
    const y = (r() * A - t * v) % A; const yy = y < 0 ? y + A : y;
    ctx.globalAlpha = (0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t * 2 + fase))) * forca;
    circulo(ctx, x0 + Math.sin(t + fase) * 20, yy, s, cor);
  }
  ctx.globalAlpha = 1;
}
function mesa(ctx) {
  const r = rng(5);
  const tons = ['#4a2f1d', '#3f2818', '#52331f', '#442b1a', '#3a2416', '#4d311e'];
  for (let i = 0; i < 6; i++) {
    const x = i * 180; const g = ctx.createLinearGradient(x, 0, x + 180, 0);
    g.addColorStop(0, tons[i]); g.addColorStop(0.5, tons[(i + 2) % 6]); g.addColorStop(1, tons[i]);
    ctx.fillStyle = g; ctx.fillRect(x, 0, 180, A);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x + 177, 0, 3, A);
    ctx.strokeStyle = 'rgba(255,220,180,0.07)'; ctx.lineWidth = 2;
    for (let k = 0; k < 7; k++) {
      const gx = x + 15 + r() * 150, amp = 4 + r() * 10, f = 0.004 + r() * 0.006;
      ctx.beginPath(); for (let y = 0; y <= A; y += 40) ctx.lineTo(gx + Math.sin(y * f + k) * amp, y); ctx.stroke();
    }
  }
  // prato e copo vistos de cima
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  circulo(ctx, 1010, 1280, 250, '#f2efe9'); ctx.restore();
  circulo(ctx, 1010, 1280, 175, '#e6e2da');
  ctx.save(); ctx.globalAlpha = 0.5; circulo(ctx, 80, 1180, 95, '#cfe3ef'); ctx.globalAlpha = 0.8;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(80, 1180, 95, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  // vinheta
  const v = ctx.createRadialGradient(L / 2, A / 2, 300, L / 2, A / 2, 1200);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.65)'); ctx.fillStyle = v; ctx.fillRect(0, 0, L, A);
}
function qr(ctx, x, y, size, semente) {
  const n = 25, m = size / n, r = rng(semente);
  ctx.fillStyle = '#fff'; ctx.fillRect(x - m, y - m, size + 2 * m, size + 2 * m);
  ctx.fillStyle = '#111';
  const finder = (i, j) => (i < 8 && j < 8) || (i > n - 9 && j < 8) || (i < 8 && j > n - 9);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const v = r(); if (!finder(i, j) && v > 0.52) ctx.fillRect(x + i * m, y + j * m, m + 0.5, m + 0.5); }
  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([i, j]) => {
    ctx.fillStyle = '#111'; ctx.fillRect(x + i * m, y + j * m, 7 * m, 7 * m);
    ctx.fillStyle = '#fff'; ctx.fillRect(x + (i + 1) * m, y + (j + 1) * m, 5 * m, 5 * m);
    ctx.fillStyle = '#111'; ctx.fillRect(x + (i + 2) * m, y + (j + 2) * m, 3 * m, 3 * m);
  });
}
function plaquinhaQR(ctx, cx, cy, s) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.rotate(-0.05);
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 20;
  rr(ctx, -200, -240, 400, 480, 34); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
  rr(ctx, -200, -240, 400, 86, 34); ctx.fillStyle = gradAzul(ctx, -200, 0, 200, 0); ctx.fill(); ctx.fillRect(-200, -190, 400, 36);
  txt(ctx, 'Cardápio digital', 0, -197, 800, 34, '#fff', 'center');
  qr(ctx, -130, -120, 260, 21);
  txt(ctx, 'Aponte a câmera', 0, 200, 700, 26, '#5b6475', 'center');
  ctx.restore();
}

// ===================== COMIDA =====================
function comida(ctx, tipo, cx, cy, s) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  if (tipo === 'burger') {
    ctx.beginPath(); ctx.ellipse(0, -10, 38, 26, 0, Math.PI, 0); ctx.closePath(); ctx.fillStyle = '#eda23e'; ctx.fill();
    ctx.fillStyle = '#fff3d6'; [[-16, -22], [0, -28], [15, -21], [-6, -16], [9, -14]].forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 3, 1.8, 0.4, 0, 7); ctx.fill(); });
    ctx.fillStyle = '#5cb85c'; ctx.beginPath(); for (let x = -40; x <= 40; x += 8) ctx.lineTo(x, -8 + (x / 8 % 2 ? 5 : 0)); ctx.lineTo(40, -2); ctx.lineTo(-40, -2); ctx.fill();
    ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.moveTo(-38, -2); ctx.lineTo(38, -2); ctx.lineTo(24, 10); ctx.lineTo(-30, 6); ctx.fill();
    rr(ctx, -38, 2, 76, 14, 7); ctx.fillStyle = '#6b3a1e'; ctx.fill();
    rr(ctx, -36, 16, 72, 16, 8); ctx.fillStyle = '#e39a35'; ctx.fill();
  } else if (tipo === 'pizza') {
    ctx.beginPath(); ctx.moveTo(-34, -26); ctx.lineTo(34, -26); ctx.lineTo(0, 34); ctx.closePath(); ctx.fillStyle = '#f6c443'; ctx.fill();
    rr(ctx, -38, -34, 76, 12, 6); ctx.fillStyle = '#d98a2b'; ctx.fill();
    [[-14, -12], [12, -10], [0, 8]].forEach(([x, y]) => circulo(ctx, x, y, 7, '#d6402b'));
  } else if (tipo === 'batata') {
    ctx.fillStyle = '#f7d046'; for (let i = -3; i <= 3; i++) { ctx.save(); ctx.translate(i * 8, -14); ctx.rotate(i * 0.09); ctx.fillRect(-3, -22, 7, 34); ctx.restore(); }
    ctx.beginPath(); ctx.moveTo(-30, -6); ctx.lineTo(30, -6); ctx.lineTo(22, 32); ctx.lineTo(-22, 32); ctx.closePath(); ctx.fillStyle = '#e0352b'; ctx.fill();
    estrela(ctx, 0, 12, 9, '#ffcc33');
  } else if (tipo === 'bebida') {
    ctx.beginPath(); ctx.moveTo(-22, -24); ctx.lineTo(22, -24); ctx.lineTo(16, 32); ctx.lineTo(-16, 32); ctx.closePath(); ctx.fillStyle = COR.azul1; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-22, -30, 44, 8); ctx.fillStyle = '#e0352b'; ctx.save(); ctx.rotate(0.25); ctx.fillRect(4, -52, 5, 28); ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-12, -10, 5, 30);
  }
  ctx.restore();
}

// ===================== CELULAR =====================
// ph: {x, y, s, rot, giro}. giro de 0 a 1: largura aparente (efeito de virar o aparelho).
function celular(ctx, ph, tela) {
  const giro = ph.giro === undefined ? 1 : ph.giro;
  ctx.save(); ctx.translate(ph.x, ph.y); ctx.rotate(ph.rot || 0); ctx.scale(ph.s * Math.max(0.02, giro), ph.s);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 40;
  rr(ctx, -210, -435, 420, 870, 66); ctx.fillStyle = '#16181e'; ctx.fill(); ctx.restore();
  const borda = ctx.createLinearGradient(-210, -435, 210, 435); borda.addColorStop(0, '#5a6070'); borda.addColorStop(0.5, '#1b1e25'); borda.addColorStop(1, '#4a505e');
  ctx.lineWidth = 5; ctx.strokeStyle = borda; rr(ctx, -210, -435, 420, 870, 66); ctx.stroke();
  ctx.fillStyle = '#2a2e38'; ctx.fillRect(-215, -260, 5, 70); ctx.fillRect(-215, -170, 5, 70); ctx.fillRect(210, -220, 5, 110);
  ctx.save(); rr(ctx, -196, -421, SW, SH, 52); ctx.clip(); ctx.translate(-196, -421);
  ctx.fillStyle = COR.tela; ctx.fillRect(0, 0, SW, SH); tela(ctx);
  ctx.restore();
  rr(ctx, -56, -409, 112, 32, 16); ctx.fillStyle = '#000'; ctx.fill();
  ctx.save(); rr(ctx, -196, -421, SW, SH, 52); ctx.clip();
  const brilho = ctx.createLinearGradient(-196, -421, 196, 421); brilho.addColorStop(0, 'rgba(255,255,255,0.10)'); brilho.addColorStop(0.35, 'rgba(255,255,255,0)'); brilho.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = brilho; ctx.fillRect(-196, -421, SW, SH);
  if (giro < 1) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - giro) * 0.7 + ')'; ctx.fillRect(-196, -421, SW, SH); }
  ctx.restore(); ctx.restore();
}
// ponto da tela (em pontos) para coordenadas do vídeo
function noVideo(ph, sx, sy) {
  const dx = ph.s * (sx - 196), dy = ph.s * (sy - 421), c = Math.cos(ph.rot || 0), s = Math.sin(ph.rot || 0);
  return [ph.x + dx * c - dy * s, ph.y + dx * s + dy * c];
}
function barraStatus(ctx, cor) {
  txt(ctx, '20:41', 40, 30, 700, 16, cor);
  ctx.fillStyle = cor; for (let i = 0; i < 4; i++) ctx.fillRect(292 + i * 6, 34 - i * 3 - 4, 4, 4 + i * 3);
  ctx.strokeStyle = cor; ctx.lineWidth = 1.5; rr(ctx, 324, 23, 26, 13, 4); ctx.stroke(); ctx.fillRect(327, 26, 18, 7); ctx.fillRect(351, 27, 2, 5);
}
function toque(ctx, x, y, p) {
  if (p <= 0 || p >= 1) return;
  ctx.save();
  ctx.globalAlpha = (1 - p) * 0.9; ctx.strokeStyle = COR.azul2; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x, y, 14 + 46 * sai(p), 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = (1 - p) * 0.55; circulo(ctx, x, y, 22 * (1 - p * 0.4), '#9cc6ff');
  ctx.restore();
}

// ===================== TELAS DO APP (ilustrativas) =====================
const PRATOS = [
  ['burger', 'Burger da Casa', 'Brioche, blend 180 g e cheddar', 'R$ 32,90', '#fff1df'],
  ['burger', 'Smash Duplo', 'Dois smash, bacon e molho', 'R$ 36,90', '#fff1df'],
  ['pizza', 'Pizza Margherita', 'Tomate, muçarela e manjericão', 'R$ 49,90', '#fff6dc'],
  ['batata', 'Batata Rústica', 'Alecrim e páprica defumada', 'R$ 22,90', '#ffe9e6'],
  ['bebida', 'Refrigerante', 'Lata 350 ml', 'R$ 6,90', '#e8f1ff'],
];

function telaConfirmado(ctx, t) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, SW, SH); barraStatus(ctx, '#111');
  txt(ctx, TXT.restaurante, SW / 2, 78, 700, 17, '#5b6475', 'center');
  const pc = sai(progresso(t, 0.0, 0.45));
  ctx.save(); ctx.translate(SW / 2, 220); ctx.scale(0.6 + 0.4 * salto(pc), 0.6 + 0.4 * salto(pc));
  ctx.globalAlpha = pc; circulo(ctx, 0, 0, 72, gradAzul(ctx, -72, -72, 72, 72));
  ctx.globalAlpha = 0.25 * pc; circulo(ctx, 0, 0, 92 + 10 * Math.sin(t * 5), COR.azul2); ctx.globalAlpha = 1;
  check(ctx, 0, 0, 62, '#fff', 11, progresso(t, 0.25, 0.4));
  ctx.restore();
  const pt = sai(progresso(t, 0.35, 0.4));
  ctx.globalAlpha = pt; txt(ctx, 'Pedido enviado!', SW / 2, 345 + (1 - pt) * 20, 800, 31, COR.texto, 'center');
  txt(ctx, 'Mesa 7 · Pedido #128', SW / 2, 384 + (1 - pt) * 20, 600, 17, '#6a7384', 'center'); ctx.globalAlpha = 1;
  const itens = [['burger', '1x Burger da Casa', 'R$ 32,90'], ['batata', '1x Batata Rústica', 'R$ 22,90'], ['bebida', '1x Refrigerante', 'R$ 6,90']];
  itens.forEach(([tp, nome, preco], i) => {
    const p = sai(progresso(t, 0.5 + i * 0.12, 0.35)); if (p <= 0) return;
    ctx.save(); ctx.globalAlpha = p; ctx.translate((1 - p) * 60, 0);
    const y = 430 + i * 84; rr(ctx, 20, y, SW - 40, 72, 16); ctx.fillStyle = COR.tela; ctx.fill();
    rr(ctx, 30, y + 10, 52, 52, 12); ctx.fillStyle = '#fff1df'; ctx.fill(); comida(ctx, tp, 56, y + 38, 0.55);
    txt(ctx, nome, 96, y + 36, 700, 17, COR.texto); txt(ctx, preco, SW - 36, y + 36, 800, 17, COR.azul1, 'right');
    ctx.restore();
  });
  const pt2 = sai(progresso(t, 0.95, 0.35));
  ctx.globalAlpha = pt2; rr(ctx, 20, 700, SW - 40, 62, 18); ctx.fillStyle = gradAzul(ctx, 20, 0, SW - 20, 0); ctx.fill();
  txt(ctx, 'Acompanhar pedido', SW / 2, 731, 800, 19, '#fff', 'center'); ctx.globalAlpha = 1;
}

function telaCamera(ctx, t, okP) {
  const g = ctx.createLinearGradient(0, 0, 0, SH); g.addColorStop(0, '#3b2717'); g.addColorStop(1, '#22160d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, SW, SH);
  ctx.save(); ctx.translate(SW / 2, 400); ctx.scale(0.62, 0.62); ctx.translate(-SW / 2, -400); plaquinhaQR(ctx, SW / 2, 400, 1); ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, SW, SH);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, SW, SH); rr(ctx, SW / 2 - 135, 265, 270, 270, 26); ctx.clip('evenodd');
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, SW, SH); ctx.restore();
  barraStatus(ctx, '#fff');
  txt(ctx, 'Aponte para o QR Code', SW / 2, 200, 700, 19, '#fff', 'center');
  const cor = okP > 0 ? COR.azul2 : '#fff', esc = 1 + 0.08 * Math.sin(okP * Math.PI);
  ctx.save(); ctx.translate(SW / 2, 400); ctx.scale(esc, esc); ctx.strokeStyle = cor; ctx.lineWidth = 7; ctx.lineCap = 'round';
  const h = 135, c = 40;
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy]) => { ctx.beginPath(); ctx.moveTo(sx * h, sy * (h - c)); ctx.lineTo(sx * h, sy * h); ctx.lineTo(sx * (h - c), sy * h); ctx.stroke(); });
  ctx.restore();
  if (okP <= 0) {

function logoRS2(ctx, x, y, h, giro, comDigital = true, brilho = -1) {

function desenhaLogo(ctx, x, y, h, giro, comDigital, brilho) {
  ctx.save(); ctx.translate(x, y);
  const c = Math.cos(giro), sn = Math.sin(giro);

  ctx.font = F(800, h * 0.42); const w2 = ctx.measureText('2').width;
  ctx.font = F(700, h * 0.3); const wD = comDigital ? ctx.measureText('Digital').width : 0;
  const total = wRS + w2 * 0.6 + (comDigital ? wD + h * 0.04 : 0);
  ctx.scale(Math.abs(c) < 0.03 ? 0.03 * Math.sign(c || 1) : c, 1);

  for (let i = 10; i >= 1; i--) {
    const off = sn * i * h * 0.012;
    ctx.font = F(900, h); ctx.fillStyle = i > 5 ? '#08224f' : '#0b3d8f'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';

  if (comDigital) { ctx.font = F(700, h * 0.3); ctx.fillStyle = '#fff'; ctx.fillText('Digital', x0 + wRS + h * 0.04, h * 0.3); }
  if (brilho >= 0 && brilho <= 1) {

    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x0 - h, -h, total + 2 * h, 2 * h);
  }
  ctx.restore();
}

function celularMeio(T) {
  const entraP = sai(progresso(T, 5.55, 0.7)), zoom = suave(progresso(T, 7.0, 0.65));
  let ph = { x: mistura(540, 560, entraP), y: mistura(2500, 1420, entraP), s: 0.86, rot: mistura(0.25, 0.07, entraP) };
  ph = { x: mistura(ph.x, 540, zoom), y: mistura(ph.y, 1090, zoom), s: mistura(ph.s, 1.24, zoom), rot: mistura(ph.rot, 0, zoom) };
  ph.y += Math.sin(T * 1.1) * 6;
  // pedido: celular desce um pouco enquanto o pedido sobe
  const desce = suave(progresso(T, 12.25, 0.5)) * (1 - suave(progresso(T, 13.4, 0.5)));
  ph.y += desce * 140; ph.s -= desce * 0.1;

  if (g2 > 0) { ph.giro = Math.abs(Math.cos(suave(g2) * Math.PI)); ph.lado = g2 < 0.5 ? 'restaurante' : 'cliente2'; }

async function renderAudio(quais) {

    fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(f1, t0 + dur); const g = ac.createGain();
    if (forma === 'cai') { g.gain.setValueAtTime(g0, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); }
    else { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(g0, t0 + dur * (forma === 'sobe' ? 0.95 : 0.6)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); }
    s.connect(fl); fl.connect(g); g.connect(mestre); s.start(t0, (t0 * 7.3) % 1); s.stop(t0 + dur + 0.02); };

  if (quais.includes('musica')) {
    const batida = 60 / CONFIG.bpm;
    for (let i = 0; i * batida < dur - 0.6; i++) {

      som(t + batida / 2, 0.05, 'highpass', 7000, 9000, 0.12 * forte);
      if (i % 2 === 1) som(t, 0.14, 'bandpass', 1800, 1200, 0.18 * forte, 'cai', 0.8);

    }
    ACORDES.forEach(([a, b, notas]) => notas.forEach((f, k) => { const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = (k % 2 ? 7 : -7); fl.type = 'lowpass'; fl.frequency.value = 1400;
      g.gain.setValueAtTime(0.0001, a); g.gain.linearRampToValueAtTime(0.022, a + 0.3); g.gain.setValueAtTime(0.022, b - 0.2); g.gain.linearRampToValueAtTime(0.0001, b);
      o.connect(fl); fl.connect(g); g.connect(mestre); o.start(a); o.stop(b + 0.05); }));
    // arpejo final que fica no ar
    [523.3, 659.3, 784, 1046.5].forEach((f, i) => osc('triangle', f, 26.1 + i * 0.12, 29.8, 0.07));
  }
  if (quais.includes('efeitos')) {
    EFEITOS.forEach(([tipo, t, a, b]) => {
      if (tipo === 'toque') { som(t, 0.04, 'highpass', 2500, 3500, 0.5); osc('sine', 900, t, t + 0.06, 0.25); }
      if (tipo === 'pop') { osc('sine', 500, t, t + 0.12, 0.45, mestre, 1100); }
      if (tipo === 'whoosh') som(t, a, 'bandpass', 400, 3500, 0.7 * (b || 0.6), 'meio', 1.2);
      if (tipo === 'riser') som(t, a, 'bandpass', 250, 5000, 0.45, 'sobe', 2);
      if (tipo === 'boom') { osc('sine', 140, t, t + 0.9, 1.0, mestre, 32); som(t, 0.35, 'lowpass', 900, 120, 0.8); }
      if (tipo === 'brilho') [2637, 3136, 3951, 5274].forEach((f, i) => osc('sine', f, t + i * 0.05, t + i * 0.05 + 0.5, 0.08));
      if (tipo === 'bip') { osc('sine', 1760, t, t + 0.09, 0.35); osc('sine', 2349, t + 0.11, t + 0.24, 0.35); }
      if (tipo === 'giro') som(t, 0.6, 'bandpass', 800, 2500, 0.5, 'meio', 3);
      if (tipo === 'ding') { osc('sine', 1318.5, t, t + 1.1, 0.35); osc('sine', 1975.5, t + 0.09, t + 1.3, 0.28); }
      if (tipo === 'digita') for (let k = 0; k < 13; k++) som(t + k * a / 13, 0.025, 'highpass', 4000, 5000, 0.3);
      if (tipo === 'carimbo') { osc('sine', 160, t, t + 1.0, 1.2, mestre, 35); som(t, 0.08, 'bandpass', 1400, 900, 1.0, 'cai', 1.5); som(t, 0.5, 'lowpass', 1200, 100, 0.7); }
    });
  }
  return wavBase64(await ac.startRendering());
}
async function trilha() { return renderAudio(['musica', 'efeitos']); }
async function trilhaPartes() { return { musica: await renderAudio(['musica']), efeitos: await renderAudio(['efeitos']) }; }

function wavBase64(buf) {
  const canais = buf.numberOfChannels, n = buf.length, bytes = 44 + n * canais * 2;
  const v = new DataView(new ArrayBuffer(bytes));
  const s = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  s(0, 'RIFF'); v.setUint32(4, bytes - 8, true); s(8, 'WAVE'); s(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, canais, true); v.setUint32(24, buf.sampleRate, true);
  v.setUint32(28, buf.sampleRate * canais * 2, true); v.setUint16(32, canais * 2, true); v.setUint16(34, 16, true);
  s(36, 'data'); v.setUint32(40, n * canais * 2, true);
  const dados = []; for (let c = 0; c < canais; c++) dados.push(buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < canais; c++) { v.setInt16(o, limita(dados[c][i], -1, 1) * 32767, true); o += 2; }
  const u8 = new Uint8Array(v.buffer); let bin = '';
  for (let i = 0; i < u8.length; i += 32768) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
  return btoa(bin);
}

window.CONFIG = CONFIG; window.STORYBOARD = STORYBOARD; window.trilha = trilha; window.trilhaPartes = trilhaPartes; window.definirEscala = definirEscala;
window.seek = (t) => desenha(limita(t, 0, CONFIG.duracao - 1 / CONFIG.fps));
if (new URLSearchParams(location.search).has('render')) {
  desenha(0);
} else {
  let pausado = false, base = performance.now(), ultimo = 0;
  tela.addEventListener('click', () => { pausado = !pausado; base = performance.now() - ultimo * 1000; });
  (function laco(agora) {
    if (!pausado) { ultimo = ((agora - base) / 1000) % CONFIG.duracao; desenha(ultimo); }
    requestAnimationFrame(laco);
  })(performance.now());
}
