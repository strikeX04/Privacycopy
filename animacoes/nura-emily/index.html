// ===================== AJUDANTES =====================
function rng(semente) { let a = semente >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const limita = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mistura = (a, b, p) => a + (b - a) * p;
const progresso = (t, ini, dur) => limita((t - ini) / dur);
const suave = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

const linear = (p) => p;
function chave(t, ks, fn = suave) {
  if (t <= ks[0][0]) return ks[0][1];

  return ks[ks.length - 1][1];
}
const em2 = (t) => Math.floor(t * 15) / 15;
function treme(t, k, amp = 1.5) { const r = rng(CONFIG.semente * 977 + k * 131 + Math.floor(t * 15)); return [(r() - 0.5) * 2 * amp, (r() - 0.5) * 2 * amp]; }
function piscar(t, tempos) { return tempos.some((x) => Math.abs(t - x) < 0.07) ? 1 : 0; }
function sombra(ctx, on = true, dx = 6, dy = 8, a = 0.2) {
  if (on) { ctx.shadowColor = `rgba(20,15,10,${a})`; ctx.shadowOffsetX = dx; ctx.shadowOffsetY = dy; ctx.shadowBlur = 0; }
  else { ctx.shadowColor = 'transparent'; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; ctx.shadowBlur = 0; }
}
function texto(ctx, s, x, y, tam, cor, peso = 800, fonte = FONTE, alinha = 'center') {
  ctx.font = peso + ' ' + tam + 'px ' + fonte; ctx.fillStyle = cor; ctx.textAlign = alinha; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function camera(ctx, z, fx, fy, tx = L / 2, ty = A / 2) { ctx.translate(tx, ty); ctx.scale(z, z); ctx.translate(-fx, -fy); }
function circulo(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
// luz e cor, sempre na tela inteira
function grade(ctx, cor, a, modo = 'multiply') { if (a <= 0) return; ctx.save(); ctx.setTransform(ESCALA, 0, 0, ESCALA, 0, 0); ctx.globalCompositeOperation = modo; ctx.globalAlpha = a; ctx.fillStyle = cor; ctx.fillRect(0, 0, L, A); ctx.restore(); }
function vinheta(ctx, a) { ctx.save(); ctx.setTransform(ESCALA, 0, 0, ESCALA, 0, 0); const g = ctx.createRadialGradient(540, 960, 420, 540, 960, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, L, A); ctx.restore(); }
function luzPonto(ctx, x, y, r, a, cor = '255,190,110') { if (a <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'screen'; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${cor},${a})`); g.addColorStop(1, `rgba(${cor},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore(); }
function estrela(ctx, x, y, r, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#fff3cf'; ctx.shadowColor = COR.ouroClaro; ctx.shadowBlur = r * 1.5;
  ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r * 0.28, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r * 0.28, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - r * 0.7, y); ctx.quadraticCurveTo(x, y, x, y - r * 0.2); ctx.quadraticCurveTo(x, y, x + r * 0.7, y); ctx.quadraticCurveTo(x, y, x, y + r * 0.2); ctx.quadraticCurveTo(x, y, x - r * 0.7, y); ctx.fill(); ctx.restore();
}
function bokeh(ctx, t, semente, cores, n = 16, alfa = 0.28) {
  const r = rng(semente);

}
const grao = document.createElement('canvas'); grao.width = 540; grao.height = 960;
(() => { const g = grao.getContext('2d'), im = g.createImageData(540, 960), r = rng(99);
  for (let i = 0; i < 540 * 960; i++) { const v = 110 + r() * 145; im.data[i * 4] = v; im.data[i * 4 + 1] = v; im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); })();

// ===================== EMILY =====================
// a mesma personagem dos vídeos NURA anteriores. Origem no centro da cabeça.
function mulher(ctx, o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.incl || 0); ctx.scale(o.s, o.s);
  const P = (o.part || 0) * 45, c = o.couro || 0, g = 3 + 11 * c, ch = o.choque || 0;

  ctx.bezierCurveTo(158, 90, 178, 220, 150, 330); ctx.lineTo(-150, 330); ctx.bezierCurveTo(-178, 220, -158, 90, -150, -20); ctx.fill();

  ctx.moveTo(-270, 600); ctx.bezierCurveTo(-262, 340, -175, 255, -62, 238); ctx.lineTo(62, 238); ctx.bezierCurveTo(175, 255, 262, 340, 270, 600); ctx.closePath(); ctx.fill();

  ctx.fillStyle = COR.pele; ctx.beginPath(); ctx.ellipse(0, 10, 100, 128, 0, 0, TAU); ctx.fill();
  sombra(ctx, false);
  ctx.fillStyle = 'rgba(232,165,151,0.45)'; ctx.beginPath(); ctx.ellipse(-55, 55, 24, 13, 0, 0, TAU); ctx.ellipse(55, 55, 24, 13, 0, 0, TAU); ctx.fill();

  ctx.lineCap = 'round';
  for (const sx of [-1, 1]) {
    const ex = sx * 42, ey = 9;

      ctx.fillStyle = '#4a3020'; circulo(ctx, ex + ox, ey + oy, 10); ctx.fill();
      ctx.fillStyle = COR.olho; circulo(ctx, ex + ox, ey + oy, 6 - 2 * ch); ctx.fill();
      ctx.fillStyle = '#fff'; circulo(ctx, ex + ox + 3.5, ey + oy - 3.5, 2.6); ctx.fill();
      if (o.reflexo) { ctx.fillStyle = `rgba(242,194,107,${o.reflexo})`; for (const k of [-1, 1]) { ctx.fillRect(ex + ox - 3 + k * 2.6, ey + oy - 1, 2, 6); circulo(ctx, ex + ox - 2 + k * 2.6, ey + oy - 2.5, 1.4); ctx.fill(); } }
      ctx.restore();
      ctx.strokeStyle = COR.olho; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(ex, ey, 17 + 2 * ch, ry, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();

    }
  }
  // lágrimas que descem pela bochecha
  if (o.lagrima > 0.4) {
    for (const [sx, k] of [[-1, 0], [1, 0.5]]) {
      const q = ((o.tl || 0) * 0.45 + k) % 1, yy = 24 + q * 95;
      ctx.save(); ctx.globalAlpha = (o.lagrima - 0.4) / 0.6 * (1 - q * 0.6);
      ctx.strokeStyle = 'rgba(200,232,248,0.55)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(sx * 46, 22); ctx.lineTo(sx * (47 + q * 4), yy); ctx.stroke();
      ctx.fillStyle = '#d4eefa'; ctx.beginPath(); ctx.ellipse(sx * (47 + q * 4), yy, 5, 8, 0, 0, TAU); ctx.fill(); ctx.restore();

  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 20, -31 - 9 * w - 10 * ch); ctx.quadraticCurveTo(sx * 42, -41 - 3 * w - 12 * ch, sx * 64, -32 + 4 * w - 8 * ch); ctx.stroke(); }

  if (ch > 0.3) { ctx.fillStyle = '#6b2f2a'; ctx.beginPath(); ctx.ellipse(0, 84, 10, 8 * ch, 0, 0, TAU); ctx.fill(); }
  else { ctx.strokeStyle = COR.boca; ctx.lineWidth = 5.5; ctx.beginPath(); ctx.moveTo(-18, 82); ctx.quadraticCurveTo(0, 82 + 11 * (o.sorriso || 0), 18, 82); ctx.stroke(); }
  ctx.fillStyle = COR.couro; ctx.beginPath(); ctx.moveTo(P - g - 2, -124); ctx.lineTo(P + g + 2, -124); ctx.lineTo(P, -175); ctx.fill();

  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(P + sx * 1, -173);
    ctx.bezierCurveTo(P + sx * 60, -170, sx * 152, -142, sx * 154, -30);
    ctx.bezierCurveTo(sx * 157 + vento, 60, sx * 142 + vento * 1.5, 170, sx * 120 + vento * 2, 232); ctx.lineTo(sx * 92 + vento * 2, 232);

}
function emilyCostas(ctx, x, y, s, braco = 0) {

  ctx.bezierCurveTo(158, 90, 178, 230, 150, 345); ctx.quadraticCurveTo(0, 365, -150, 345); ctx.bezierCurveTo(-178, 230, -158, 90, -150, -20); ctx.fill();

  ctx.strokeStyle = 'rgba(54,34,26,0.55)'; ctx.lineWidth = 4;
  for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(k * 18, -170); ctx.quadraticCurveTo(k * 40, 60, k * 38, 330); ctx.stroke(); }

function mao(ctx, x, y, ang, s, braco = 0, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  sombra(ctx, true, 4, 6, 0.18); ctx.fillStyle = o.pele || COR.pele;
  ctx.beginPath(); ctx.roundRect(-38, -10, 76, 95, 30); ctx.fill();
  const dy = [8, 0, 3, 12];
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.roundRect(-37 + i * 19, -70 + dy[i], 17, 78, 8.5); ctx.fill(); }
  ctx.save(); ctx.translate(-36, 32); ctx.rotate(-0.75); ctx.beginPath(); ctx.roundRect(-9, -52, 19, 58, 9.5); ctx.fill(); ctx.restore();

// ===================== CENÁRIOS =====================
function ruaNoite(ctx, t) {
  const g = ctx.createLinearGradient(0, 0, 0, 1300); g.addColorStop(0, COR.noite); g.addColorStop(1, COR.noite2);
  ctx.fillStyle = g; ctx.fillRect(-300, -300, L + 600, 1600);
  const r = rng(51);
  for (let i = 0; i < 9; i++) {
    const x = -120 + i * 150 + r() * 40, w = 130 + r() * 60, h = 420 + r() * 520, y = 1250 - h;
    ctx.fillStyle = i % 2 ? '#172638' : '#1b2d42'; ctx.fillRect(x, y, w, h);
    for (let jy = y + 30; jy < 1200; jy += 70) for (let jx = x + 18; jx < x + w - 24; jx += 42) if (r() < 0.42) { ctx.fillStyle = `rgba(242,194,107,${0.35 + r() * 0.5})`; ctx.fillRect(jx, jy, 20, 30); }
  }
  ctx.fillStyle = '#26323f'; ctx.fillRect(-300, 1250, L + 600, 900);
  ctx.strokeStyle = 'rgba(242,194,107,0.12)'; ctx.lineWidth = 6;
  for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(540, 1240); ctx.lineTo(540 + i * 260, 2000); ctx.stroke(); }
  for (const [px, h] of [[150, 760], [930, 760]]) {
    ctx.fillStyle = '#0d151f'; ctx.fillRect(px - 9, 1260 - h, 18, h); ctx.fillRect(px - 9, 1260 - h, px < 540 ? 70 : -70, 12);
    const lx = px + (px < 540 ? 62 : -62), ly = 1275 - h;
    ctx.fillStyle = COR.poste; circulo(ctx, lx, ly, 16); ctx.fill();
    luzPonto(ctx, lx, ly, 230, 0.55);
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = 'rgba(242,194,107,0.09)'; ctx.beginPath(); ctx.moveTo(lx - 14, ly); ctx.lineTo(lx + 14, ly); ctx.lineTo(lx + 200, 1500); ctx.lineTo(lx - 200, 1500); ctx.fill(); ctx.restore();
  }
}
// pessoa vista de costas, andando
function pessoaCostas(ctx, x, y, s, o, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const ph = Math.sin(em2(t) * 7 + (o.fase || 0)), alt = o.alt || 1;
  ctx.fillStyle = '#0e141c';
  for (const sx of [-1, 1]) { const d = sx * ph; ctx.beginPath(); ctx.roundRect(sx * 30 - 18 + d * 6, -10, 36, 330 * alt - Math.max(0, d) * 14, 14); ctx.fill(); }
  ctx.fillStyle = o.casaco; ctx.beginPath(); ctx.roundRect(-95, -340 * alt, 190, 360 * alt, [60, 60, 18, 18]); ctx.fill();
  ctx.fillStyle = o.casaco; ctx.beginPath(); ctx.roundRect(o.lado > 0 ? -125 : 85, -320 * alt, 40, 250 * alt, 20); ctx.fill();
  ctx.fillStyle = '#1a1210'; circulo(ctx, 0, -340 * alt - 70, 66); ctx.fill();
  if (o.cabelo) { ctx.fillStyle = o.cabelo; ctx.beginPath(); ctx.ellipse(0, -340 * alt - 74, 74, 76, 0, Math.PI, 0); ctx.lineTo(70, -340 * alt + 120); ctx.quadraticCurveTo(0, -340 * alt + 150, -70, -340 * alt + 120); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle = 'rgba(242,194,107,0.55)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, -340 * alt - 70, 66, -1.2, 0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(95, -300 * alt); ctx.lineTo(95, 0); ctx.stroke();
  ctx.restore();
}
