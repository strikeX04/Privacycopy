<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NURA: scalp</title>
<style>
  html, body { margin: 0; background: #111; height: 100%; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; margin: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- fotos originais do produto enviadas pelo usuário, recortadas, em base64 -->
<script src="imagens.js"></script>
<script>
// ===================== CONFIGURAÇÃO =====================
const CONFIG = { largura: 1080, altura: 1920, fps: 30, duracao: 45, bpm: 76, semente: 11 };
const COR = {
  creme: '#f4efe3', creme2: '#e9dfca', quente: '#f6e4c8', verde: '#1e5a3c', verdeEsc: '#163f2b', verdeMeio: '#2b6b4a',
  folha: '#5e9b4f', folhaClara: '#8cbf6a', ouro: '#c8a04f', ouroClaro: '#e8c97f',
  pele: '#ecc09d', peleSombra: '#d9a582', cabelo: '#4a2f22', cabeloEsc: '#36221a', cabeloLuz: '#6e4835',
  couro: '#f2cdb3', rosa: '#e8a597', boca: '#b05a4c', olho: '#2b1d16', vidro: '#e6eee6', madeira: '#b98656',
};
const FONTE = 'Inter, "Liberation Sans", Arial, sans-serif';
const FONTE_T = 'Caladea, "Liberation Serif", Georgia, serif';

// legendas: [início, fim, texto], tiradas das pausas reais da narração (voz.wav)
const LEGENDAS = [[0.54, 1.71, "Do you ever change the way"], [1.71, 2.57, "you part your hair,"], [2.57, 3.92, "just so your scalp won't show?"], [6.06, 7.67, "It can feel like a tiny thing."], [7.67, 9.64, "But when it happens every morning,"], [9.64, 11.26, "it doesn't feel tiny anymore."], [13.02, 14.18, "Here's what many people"], [14.18, 14.88, "don't realize."], [15.66, 17.0, "Your hair naturally goes"], [17.0, 18.26, "through growing, resting,"], [18.26, 19.5, "and shedding phases."], [21.3, 22.79, "Stress, hormonal changes,"], [22.79, 23.8, "and other factors"], [23.8, 25.4, "can affect what you notice."], [26.22, 27.43, "And a more visible scalp"], [27.43, 28.9, "doesn't tell the whole story."], [30.04, 31.26, "You deserve answers,"], [31.26, 32.72, "not impossible promises."], [33.42, 34.74, "Start with gentle care,"], [34.74, 36.35, "and talk to a dermatologist"], [36.35, 37.46, "if changes persist."], [38.32, 39.16, "Meet NURA."], [39.16, 39.9, "A moment of care"], [39.9, 41.42, "in your everyday routine."]];
const DESTAQUE = new Set(['scalp', 'tiny', 'growing,', 'resting,', 'shedding', 'Stress,', 'hormonal', 'changes,', 'factors', 'whole', 'story.', 'gentle', 'care,', 'dermatologist', 'NURA.', 'care']);

// ===================== AJUDANTES =====================
function rng(semente) { let a = semente >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const limita = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mistura = (a, b, p) => a + (b - a) * p;
const progresso = (t, ini, dur) => limita((t - ini) / dur);
const suave = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const salto = (p) => { if (p <= 0) return 0; const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const L = CONFIG.largura, A = CONFIG.altura;
const TAU = Math.PI * 2;

// chaves [[t, valor], ...] com transição suave entre elas
function chave(t, ks, fn = suave) {
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) return mistura(ks[i - 1][1], ks[i][1], fn((t - ks[i - 1][0]) / (ks[i][0] - ks[i - 1][0])));
  return ks[ks.length - 1][1];
}
const linear = (p) => p;
// tremor "em 2": muda a cada 2 quadros, dá cara de papel animado à mão
function treme(t, k, amp = 1.5) { const r = rng(CONFIG.semente * 977 + k * 131 + Math.floor(t * 15)); return [(r() - 0.5) * 2 * amp, (r() - 0.5) * 2 * amp]; }
function piscar(t, tempos) { return tempos.some((x) => Math.abs(t - x) < 0.07) ? 1 : 0; }

function sombra(ctx, on = true, dx = 6, dy = 8, a = 0.2) {
  if (on) { ctx.shadowColor = `rgba(60,40,20,${a})`; ctx.shadowOffsetX = dx; ctx.shadowOffsetY = dy; ctx.shadowBlur = 0; }
  else { ctx.shadowColor = 'transparent'; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; ctx.shadowBlur = 0; }
}
function texto(ctx, s, x, y, tam, cor, peso = 800, fonte = FONTE, alinha = 'center') {
  ctx.font = peso + ' ' + tam + 'px ' + fonte; ctx.fillStyle = cor; ctx.textAlign = alinha; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function camera(ctx, z, fx, fy, tx = L / 2, ty = A / 2) { ctx.translate(tx, ty); ctx.scale(z, z); ctx.translate(-fx, -fy); }
function circulo(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }

// grão de papel, gerado uma vez com semente fixa
const grao = document.createElement('canvas'); grao.width = 540; grao.height = 960;
(() => { const g = grao.getContext('2d'), im = g.createImageData(540, 960), r = rng(99);
  for (let i = 0; i < 540 * 960; i++) { const v = 110 + r() * 145; im.data[i * 4] = v; im.data[i * 4 + 1] = v; im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); })();

// ===================== PEÇAS =====================
function folhaForma(ctx, x, y, tam, ang, cor, veia = true) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = cor; ctx.beginPath(); ctx.moveTo(0, -tam);
  ctx.bezierCurveTo(tam * 0.58, -tam * 0.55, tam * 0.5, tam * 0.55, 0, tam);
  ctx.bezierCurveTo(-tam * 0.5, tam * 0.55, -tam * 0.58, -tam * 0.55, 0, -tam); ctx.fill();
  if (veia) {
    sombra(ctx, false); ctx.strokeStyle = 'rgba(232,201,127,0.75)'; ctx.lineWidth = Math.max(2, tam * 0.035); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -tam * 0.85); ctx.lineTo(0, tam * 0.95); ctx.stroke();
    ctx.lineWidth = Math.max(1.5, tam * 0.02);
    for (let i = -2; i <= 2; i++) { const yy = i * tam * 0.3; ctx.beginPath(); ctx.moveTo(0, yy + tam * 0.1); ctx.lineTo(tam * 0.3, yy - tam * 0.1); ctx.moveTo(0, yy + tam * 0.1); ctx.lineTo(-tam * 0.3, yy - tam * 0.1); ctx.stroke(); }
  }
  ctx.restore();
}

function fundoParede(ctx) {
  ctx.fillStyle = COR.creme; ctx.fillRect(-400, -400, L + 800, A + 800);
  ctx.fillStyle = 'rgba(200,160,79,0.07)';
  for (let x = -400; x < L + 400; x += 90) ctx.fillRect(x, -400, 40, A + 800);
}

function espelho(ctx, cx, cy, rx, ry, dentro) {
  ctx.save();
  sombra(ctx, true, 8, 12, 0.22);
  ctx.fillStyle = COR.ouro; ctx.beginPath(); ctx.ellipse(cx, cy, rx + 24, ry + 24, 0, 0, TAU); ctx.fill();
  sombra(ctx, false);
  ctx.fillStyle = COR.ouroClaro; ctx.beginPath(); ctx.ellipse(cx, cy, rx + 10, ry + 10, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = COR.vidro; ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
  ctx.fillStyle = 'rgba(30,90,60,0.06)'; ctx.fillRect(cx - rx, cy + ry * 0.2, rx * 2, ry);
  dentro();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.moveTo(cx - rx, cy - ry * 0.2); ctx.lineTo(cx - rx * 0.2, cy - ry); ctx.lineTo(cx, cy - ry); ctx.lineTo(cx - rx, cy + ry * 0.05); ctx.fill();
  ctx.restore();
}

function relogio(ctx, x, y, r, ang) {
  ctx.save(); sombra(ctx, true, 4, 6, 0.18);
  ctx.fillStyle = COR.creme; circulo(ctx, x, y, r); ctx.fill(); sombra(ctx, false);
  ctx.strokeStyle = COR.verde; ctx.lineWidth = 7; circulo(ctx, x, y, r); ctx.stroke();
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * 0.72, y + Math.sin(a) * r * 0.72); ctx.lineTo(x + Math.cos(a) * r * 0.85, y + Math.sin(a) * r * 0.85); ctx.stroke(); }
  ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang / 12 - 1.2) * r * 0.45, y + Math.sin(ang / 12 - 1.2) * r * 0.45); ctx.stroke();
  ctx.strokeStyle = COR.ouro; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang - Math.PI / 2) * r * 0.68, y + Math.sin(ang - Math.PI / 2) * r * 0.68); ctx.stroke();
  ctx.restore();
}

// mulher de papel recortado, de frente. Origem no centro da cabeça.
function mulher(ctx, o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.incl || 0); ctx.scale(o.s, o.s);
  const P = (o.part || 0) * 45, c = o.couro || 0, g = 3 + 11 * c;
  // cabelo de trás
  sombra(ctx, true, 5, 7, 0.16);
  ctx.fillStyle = COR.cabeloEsc; ctx.beginPath();
  ctx.moveTo(-150, -20); ctx.bezierCurveTo(-162, -150, -72, -188, 0, -188); ctx.bezierCurveTo(72, -188, 162, -150, 150, -20);
  ctx.bezierCurveTo(158, 90, 178, 220, 150, 330); ctx.lineTo(-150, 330); ctx.bezierCurveTo(-178, 220, -158, 90, -150, -20); ctx.fill();
  // tronco
  ctx.fillStyle = o.roupa || COR.verde; ctx.beginPath();
  ctx.moveTo(-270, 600); ctx.bezierCurveTo(-262, 340, -175, 255, -62, 238); ctx.lineTo(62, 238); ctx.bezierCurveTo(175, 255, 262, 340, 270, 600); ctx.closePath(); ctx.fill();
  sombra(ctx, false);
  ctx.fillStyle = COR.peleSombra; ctx.fillRect(-38, 95, 76, 150);
  ctx.beginPath(); ctx.moveTo(-62, 238); ctx.quadraticCurveTo(0, 312, 62, 238); ctx.fill();
  // orelhas e rosto
  ctx.fillStyle = COR.peleSombra; ctx.beginPath(); ctx.ellipse(-98, 18, 17, 27, 0, 0, TAU); ctx.ellipse(98, 18, 17, 27, 0, 0, TAU); ctx.fill();
  sombra(ctx, true, 4, 6, 0.15);
  ctx.fillStyle = COR.pele; ctx.beginPath(); ctx.ellipse(0, 10, 100, 128, 0, 0, TAU); ctx.fill();
  sombra(ctx, false);
  ctx.fillStyle = 'rgba(232,165,151,0.45)'; ctx.beginPath(); ctx.ellipse(-55, 55, 24, 13, 0, 0, TAU); ctx.ellipse(55, 55, 24, 13, 0, 0, TAU); ctx.fill();
  // olhos
  const fech = limita(o.olhos || 0), ox = (o.olharX || 0) * 6, oy = (o.olharY || 0) * 5;
  ctx.strokeStyle = COR.olho; ctx.fillStyle = COR.olho; ctx.lineCap = 'round';
  for (const sx of [-1, 1]) {
    const ex = sx * 42;
    if (fech > 0.55) { ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(ex - 14, 10); ctx.quadraticCurveTo(ex, 19, ex + 14, 10); ctx.stroke(); }
    else {
      ctx.beginPath(); ctx.ellipse(ex + ox, 9 + oy, 10, 12 * (1 - fech), 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; circulo(ctx, ex + ox + 3, 5 + oy, 2.6); ctx.fill(); ctx.fillStyle = COR.olho;
      ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(ex - 16, -3); ctx.quadraticCurveTo(ex, -10, ex + 16, -3); ctx.stroke();
    }
  }
  // sobrancelhas: ruga levanta o canto de dentro (preocupação leve)
  const w = o.ruga || 0; ctx.strokeStyle = COR.cabelo; ctx.lineWidth = 6.5;
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 20, -29 - 9 * w); ctx.quadraticCurveTo(sx * 42, -39 - 3 * w, sx * 64, -30 + 4 * w); ctx.stroke(); }
  // nariz e boca
  ctx.strokeStyle = COR.peleSombra; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(2, 12); ctx.quadraticCurveTo(9, 38, -2, 45); ctx.stroke();
  ctx.strokeStyle = COR.boca; ctx.lineWidth = 5.5; ctx.beginPath(); ctx.moveTo(-18, 80); ctx.quadraticCurveTo(0, 80 + 11 * (o.sorriso || 0), 18, 80); ctx.stroke();
  // couro cabeludo na repartição
  ctx.fillStyle = COR.couro; ctx.beginPath(); ctx.moveTo(P - g - 2, -124); ctx.lineTo(P + g + 2, -124); ctx.lineTo(P, -175); ctx.fill();
  // mechas da frente
  sombra(ctx, true, 4, 6, 0.18); ctx.fillStyle = COR.cabelo;
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(P + sx * 1, -173);
    ctx.bezierCurveTo(P + sx * 60, -170, sx * 152, -142, sx * 154, -30);
    ctx.bezierCurveTo(sx * 157, 60, sx * 142, 170, sx * 120, 232); ctx.lineTo(sx * 92, 232);
    ctx.bezierCurveTo(sx * 100, 150, sx * 104, 60, sx * 96, -18);
    ctx.bezierCurveTo(sx * 88, -80, P + sx * 40, -110, P + sx * g, -126); ctx.closePath(); ctx.fill();
  }
  sombra(ctx, false);
  ctx.strokeStyle = 'rgba(54,34,26,0.6)'; ctx.lineWidth = 3.5;
  for (const sx of [-1, 1]) for (let k = 1; k <= 3; k++) {
    ctx.beginPath(); ctx.moveTo(P + sx * (g + 6 + k * 5), -160 + k * 5);
    ctx.quadraticCurveTo(sx * (70 + k * 22), -150 + k * 12, sx * (122 + k * 8), -20 + k * 34); ctx.stroke();
  }
  // brilho dourado na repartição: o fio visual
  const b = o.brilho || 0;
  if (b > 0) {
    ctx.save(); ctx.globalAlpha = b; ctx.strokeStyle = COR.ouroClaro; ctx.lineWidth = 5 + 4 * c; ctx.shadowColor = COR.ouro; ctx.shadowBlur = 26 * b;
    ctx.beginPath(); ctx.moveTo(P, -174); ctx.lineTo(P, -127); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
}

function mao(ctx, x, y, ang, s, braco = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  sombra(ctx, true, 4, 6, 0.18); ctx.fillStyle = COR.pele;
  ctx.beginPath(); ctx.roundRect(-38, -10, 76, 95, 30); ctx.fill();
  const dy = [8, 0, 3, 12];
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.roundRect(-37 + i * 19, -70 + dy[i], 17, 78, 8.5); ctx.fill(); }
  ctx.save(); ctx.translate(-36, 32); ctx.rotate(-0.75); ctx.beginPath(); ctx.roundRect(-9, -52, 19, 58, 9.5); ctx.fill(); ctx.restore();
  if (braco > 0) { ctx.fillStyle = COR.pele; ctx.fillRect(-30, 60, 60, braco + 30); }
  ctx.fillStyle = COR.verde; ctx.beginPath(); ctx.roundRect(-44, 78 + braco, 88, 140, 16); ctx.fill();
  ctx.restore();
}

function escova(ctx, x, y, ang, s, brilho) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  sombra(ctx, true, 5, 7, 0.2);
  ctx.fillStyle = COR.madeira; ctx.beginPath(); ctx.roundRect(-17, 40, 34, 200, 17); ctx.fill();
  ctx.fillStyle = '#d6a571'; ctx.beginPath(); ctx.roundRect(-58, -125, 116, 178, 44); ctx.fill();
  sombra(ctx, false);
  ctx.fillStyle = '#3a2d25'; ctx.beginPath(); ctx.roundRect(-47, -114, 94, 156, 36); ctx.fill();
  ctx.fillStyle = '#efe4d0';
  for (let i = 0; i < 4; i++) for (let j = 0; j < 6; j++) { circulo(ctx, -30 + i * 20, -92 + j * 24, 4.5); ctx.fill(); }
  ctx.strokeStyle = COR.cabeloLuz; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-50, -70); ctx.bezierCurveTo(-10, -100, 20, -20, 52, -50); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-48, 10); ctx.bezierCurveTo(-20, -30, 30, 30, 55, -10); ctx.stroke();
  ctx.save(); ctx.strokeStyle = COR.ouroClaro; ctx.lineWidth = 4; ctx.shadowColor = COR.ouro; ctx.shadowBlur = 18 * brilho;
  ctx.beginPath(); ctx.moveTo(-52, -30); ctx.bezierCurveTo(-15, -80, 15, 30, 60, -20); ctx.bezierCurveTo(80, -40, 95, -10, 110, -30); ctx.stroke(); ctx.restore();
  ctx.restore();
}

// close da repartição vista de cima: fios que se abrem dos dois lados
function parteClose(ctx, larg, brilho, t) {
  ctx.fillStyle = COR.cabeloEsc; ctx.fillRect(-300, -300, L + 600, A + 600);
  const px = (y) => 540 + 26 * Math.sin(y / 330), w = (y) => larg * (0.78 + 0.22 * Math.sin(y / 210 + 1));
  ctx.fillStyle = COR.couro; ctx.beginPath();
  for (let y = -300; y <= A + 300; y += 40) ctx.lineTo(px(y) - w(y) / 2, y);
  for (let y = A + 300; y >= -300; y -= 40) ctx.lineTo(px(y) + w(y) / 2, y);
  ctx.fill();
  const k = Math.floor(t * 15); ctx.lineCap = 'round';
  for (const camada of [0, 1]) for (const sx of [-1, 1]) {
    const r = rng(CONFIG.semente + camada * 31 + (sx > 0 ? 7 : 0));
    for (let i = 0; i < 64; i++) {
      const y0 = -300 + i * (A + 600) / 64 + r() * 22, x0 = px(y0) + sx * (w(y0) / 2 + 2 + r() * 6 + camada * 10);
      const len = 380 + r() * 260, dy = 110 + r() * 170, wob = (rng(k * 13 + i + camada * 500)() - 0.5) * 4;
      ctx.strokeStyle = camada ? (i % 3 ? COR.cabelo : COR.cabeloLuz) : '#2c1b14';
      ctx.lineWidth = camada ? 9 + r() * 5 : 15;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.bezierCurveTo(x0 + sx * 40, y0 + 8, x0 + sx * len * 0.6, y0 + dy * 0.3 + wob, x0 + sx * len, y0 + dy); ctx.stroke();
    }
  }
  if (brilho > 0) {
    ctx.save(); ctx.globalAlpha = brilho; ctx.strokeStyle = COR.ouroClaro; ctx.lineWidth = 7; ctx.shadowColor = COR.ouro; ctx.shadowBlur = 34;
    ctx.beginPath(); for (let y = -300; y <= A + 300; y += 40) ctx.lineTo(px(y), y); ctx.stroke(); ctx.restore();
  }
}

// corte do couro cabeludo com um folículo. ph: 0 a 1 cresce, 1 a 2 repousa, 2 a 3 cai e um fio novo começa
function foliculo(ctx, cx, cy, R, ph) {
  ctx.save(); circulo(ctx, cx, cy, R); ctx.clip();
  ctx.fillStyle = '#fbf6ec'; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  const sup = cy - R * 0.28;
  ctx.fillStyle = '#f6dccd'; ctx.fillRect(cx - R, sup, 2 * R, 2 * R);
  ctx.fillStyle = COR.couro; ctx.fillRect(cx - R, sup, 2 * R, R * 0.14);
  ctx.strokeStyle = 'rgba(217,139,116,0.25)'; ctx.lineWidth = R * 0.02;
  for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(cx - R, sup + R * 0.14 + i * R * 0.22); ctx.bezierCurveTo(cx - R * 0.3, sup + i * R * 0.22, cx + R * 0.3, sup + R * 0.3 + i * R * 0.22, cx + R, sup + R * 0.14 + i * R * 0.22); ctx.stroke(); }
  const f = ((ph % 3) + 3) % 3;
  let prof, compr = 1.1, velhoY = 0, velhoA = 1, novo = 0, clube = 0;
  if (f < 1) { prof = 0.72; compr = 0.35 + 0.75 * f; }
  else if (f < 2) { prof = 0.72 - 0.3 * (f - 1); clube = f - 1; }
  else { const q = f - 2; prof = 0.42 + 0.3 * Math.min(1, q * 1.6); velhoY = q * R * 1.4; velhoA = 1 - q; novo = q; }
  const base = sup + R * prof;
  ctx.fillStyle = '#e9b9a5'; ctx.beginPath(); ctx.roundRect(cx - R * 0.1, sup - 2, R * 0.2, base - sup + R * 0.08, R * 0.1); ctx.fill();
  ctx.fillStyle = clube > 0.5 && novo === 0 ? '#f3e3c9' : '#d98b74'; circulo(ctx, cx, base, R * 0.12); ctx.fill();
  ctx.lineCap = 'round';
  // fio velho (dourado: o fio visual)
  ctx.save(); ctx.globalAlpha = velhoA; ctx.strokeStyle = COR.ouro; ctx.lineWidth = R * 0.075; ctx.shadowColor = COR.ouroClaro; ctx.shadowBlur = R * 0.08;
  const b0 = (novo > 0 ? sup + R * 0.42 : base) - velhoY, topo = sup - R * compr - velhoY;
  ctx.beginPath(); ctx.moveTo(cx, b0); ctx.bezierCurveTo(cx, mistura(b0, topo, 0.5), cx + R * 0.12, mistura(b0, topo, 0.7), cx + R * 0.08, topo); ctx.stroke();
  if (clube > 0.3 || novo > 0) { ctx.fillStyle = COR.ouro; circulo(ctx, cx, b0, R * 0.05); ctx.fill(); }
  ctx.restore();
  if (novo > 0) {
    ctx.strokeStyle = COR.ouroClaro; ctx.lineWidth = R * 0.065;
    ctx.beginPath(); ctx.moveTo(cx, base); ctx.lineTo(cx, mistura(base, sup - R * 0.35, novo)); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = COR.verde; ctx.lineWidth = Math.max(3, R * 0.03); circulo(ctx, cx, cy, R); ctx.stroke();
}

const FASES = ['GROW', 'REST', 'SHED'];
const ANG_FASE = [-90, 30, 150].map((a) => a * Math.PI / 180);
function glifo(ctx, i, x, y, cor) {
  ctx.strokeStyle = cor; ctx.fillStyle = cor; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  if (i === 0) { ctx.moveTo(x, y + 24); ctx.lineTo(x, y - 22); ctx.moveTo(x - 16, y - 6); ctx.lineTo(x, y - 24); ctx.lineTo(x + 16, y - 6); ctx.stroke(); }

  const bp = salto(progresso(t, 3.75, 0.6)), ba = limita(progresso(t, 3.75, 0.25));

}

function cena6(ctx, t, d) {
  const g = ctx.createRadialGradient(540, 930, 60, 540, 930, 1200); g.addColorStop(0, COR.verdeMeio); g.addColorStop(1, COR.verdeEsc);
  ctx.fillStyle = g; ctx.fillRect(0, 0, L, A);

  const mv = suave(progresso(t, 0, 0.8));

  // brilho e anel dourado atrás do frasco
  const ap = suave(progresso(t, 0.4, 1.1));
  const gl = ctx.createRadialGradient(540, 930, 40, 540, 930, 520); gl.addColorStop(0, `rgba(232,201,127,${0.28 * ap})`); gl.addColorStop(1, 'rgba(232,201,127,0)'); ctx.fillStyle = gl; ctx.fillRect(0, 0, L, A);
  ctx.save(); ctx.strokeStyle = COR.ouroClaro; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(540, 930, 400, -Math.PI / 2, -Math.PI / 2 + TAU * ap); ctx.stroke(); ctx.restore();
  // o fio dourado chega pelo canto e se enrola no anel

  if (fp > 0) { ctx.save(); ctx.strokeStyle = COR.ouro; ctx.lineWidth = 4; ctx.setLineDash([1400 * fp, 2000]); ctx.beginPath(); ctx.moveTo(-20, 620); ctx.bezierCurveTo(160, 560, 120, 420, 260, 470); ctx.bezierCurveTo(330, 495, 300, 560, 220, 560); ctx.bezierCurveTo(170, 560, 150, 520, 170, 500); ctx.stroke(); ctx.restore(); }
  // folhas nos cantos
  const fl = salto(progresso(t, 0.5, 0.8));
  const sw = (k) => 0.05 * Math.sin(Math.floor(t * 15) / 15 * 1.8 + k) * para;
  ctx.save(); sombra(ctx, true, 6, 9, 0.25);
  folhaForma(ctx, mistura(-200, 40, fl), 230, 170, 0.7 + sw(1), COR.folha); folhaForma(ctx, mistura(-200, 150, fl), 120, 115, 1.4 + sw(2), COR.folhaClara);
  folhaForma(ctx, mistura(1280, 1040, fl), 260, 180, -0.6 + sw(3), COR.folha); folhaForma(ctx, mistura(1280, 930, fl), 140, 110, -1.2 + sw(4), COR.folhaClara);
  folhaForma(ctx, mistura(-200, 50, fl), 1290, 190, 2.5 + sw(5), COR.folhaClara); folhaForma(ctx, mistura(1280, 1030, fl), 1300, 180, -2.5 + sw(6), COR.folha);
  ctx.restore();

  });
  const ul = 420 * suave(progresso(t, 1.6, 0.6)); ctx.fillStyle = COR.ouroClaro; ctx.fillRect(540 - ul / 2, 438, ul, 6);
  // chamada final
  const cta = salto(progresso(t, 4.1, 0.5));
  if (cta > 0) {
    ctx.save(); ctx.translate(540, 1478); ctx.scale(cta, cta);
    ctx.font = '800 62px ' + FONTE; const w = ctx.measureText('Discover NURA.').width + 110;
    sombra(ctx, true, 6, 9, 0.3); ctx.fillStyle = COR.creme; ctx.beginPath(); ctx.roundRect(-w / 2, -58, w, 116, 58); ctx.fill(); sombra(ctx, false);
    ctx.strokeStyle = COR.ouro; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(-w / 2 + 8, -50, w - 16, 100, 50); ctx.stroke();
    texto(ctx, 'Discover NURA.', 0, 2, 62, COR.verde, 800);

  // aviso legal de suplemento
  const av = progresso(t, 4.4, 0.4);

    ['These statements have not been evaluated by the Food and', 'Drug Administration. This product is not intended to diagnose,', 'treat, cure, or prevent any disease.'].forEach((s, i) => texto(ctx, s, 540, 1564 + i * 29, 23, COR.creme, 500));

}

// [início, fim, função]. Cortes nas pausas da narração.
const CENAS = [
  [0, 5.6, cena1],
  [5.6, 12.6, cena2],
  [12.6, 21.0, cena3],
  [21.0, 29.6, cena4],
  [29.6, 37.8, cena5],
  [37.8, 45, cena6],
];
const STORYBOARD = [3.4, 8.9, 18.9, 28.2, 35.6, 44.2];

// ===================== LEGENDAS =====================
function legendasDesenha(ctx, t) {
  for (let i = 0; i < LEGENDAS.length; i++) {
    const [ini, fim, s] = LEGENDAS[i], prox = LEGENDAS[i + 1];
    const fimV = prox && prox[0] - fim < 0.6 ? prox[0] : fim + 0.3;
    if (t < ini - 0.06 || t >= fimV) continue;
    const pin = salto(progresso(t, ini - 0.06, 0.18)), pout = prox && prox[0] - fim < 0.6 ? 1 : 1 - progresso(t, fim + 0.1, 0.2);
    ctx.font = '800 54px ' + FONTE;
    const pal = s.split(' '), esp = ctx.measureText(' ').width, linhas = [[]]; let lw = 0;
    pal.forEach((p) => { const w = ctx.measureText(p).width; if (lw + w > 860 && linhas[linhas.length - 1].length) { linhas.push([]); lw = 0; } linhas[linhas.length - 1].push(p); lw += w + esp; });
    const larguras = linhas.map((ws) => ctx.measureText(ws.join(' ')).width);
    const W = Math.max(...larguras) + 72, H = linhas.length * 68 + 34;
    ctx.save(); ctx.globalAlpha = limita(pin) * pout; ctx.translate(540, 1478); ctx.scale(mistura(0.9, 1, limita(pin)), mistura(0.9, 1, limita(pin)));
    ctx.fillStyle = 'rgba(22,63,43,0.92)'; ctx.beginPath(); ctx.roundRect(-W / 2, -H / 2, W, H, 26); ctx.fill();
    ctx.strokeStyle = 'rgba(232,201,127,0.85)'; ctx.lineWidth = 3; ctx.stroke();
    linhas.forEach((ws, li) => {
      let x = -larguras[li] / 2; const y = -H / 2 + 17 + 34 + li * 68;
      ws.forEach((p) => { const w = ctx.measureText(p).width; texto(ctx, p, x, y, 54, DESTAQUE.has(p) ? COR.ouroClaro : COR.creme, 800, FONTE, 'left'); ctx.font = '800 54px ' + FONTE; x += w + esp; });
    });
    ctx.restore();
    break;
  }
}

// ===================== DESENHO =====================
const tela = document.getElementById('c');
const ctx = tela.getContext('2d');
let ESCALA = 1;
function definirEscala(e) { ESCALA = e; tela.width = Math.round(L * e); tela.height = Math.round(A * e); }
definirEscala(1);
const IMG = {};

function desenha(t) {
  ctx.setTransform(ESCALA, 0, 0, ESCALA, 0, 0);
  sombra(ctx, false); ctx.globalAlpha = 1; ctx.setLineDash([]);
  ctx.fillStyle = COR.creme; ctx.fillRect(0, 0, L, A);
  const cena = CENAS.find(([ini, fim]) => t >= ini && t < fim) || CENAS[CENAS.length - 1];
  ctx.save(); cena[2](ctx, t - cena[0], cena[1] - cena[0], t); ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.16; ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(grao, 0, 0, L, A); ctx.restore();
  legendasDesenha(ctx, t);
}

// ===================== TRILHA EM CÓDIGO =====================
// Piano suave: lá menor introspectivo até 29,6 s, dó maior esperançoso depois. Silêncio antes de "Meet NURA".
const ACORDES = [
  [0, [57, 60, 64, 69], 45], [2.8, [53, 57, 60, 64], 41], [5.6, [55, 60, 64, 67], 48], [8.4, [55, 59, 62, 67], 43],
  [11.2, [57, 60, 64, 69], 45], [14.0, [53, 57, 60, 65], 41], [16.8, [55, 60, 64, 67], 48], [19.6, [55, 59, 62, 67], 43],
  [22.4, [57, 60, 64, 69], 45], [25.2, [53, 57, 60, 65], 41], [28.0, [55, 60, 62, 67], 43],
  [29.6, [60, 64, 67, 72], 48], [31.9, [59, 62, 67, 71], 47], [34.2, [57, 60, 64, 69], 45], [36.5, [57, 60, 65, 69], 41],
  [38.3, [60, 64, 67, 72], 48], [40.6, [62, 67, 71, 74], 43], [42.2, [60, 64, 67, 72], 36],
];
async function trilha() {
  const sr = 48000, dur = CONFIG.duracao, ac = new OfflineAudioContext(2, Math.ceil(sr * dur), sr);
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.connect(ac.destination);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200; lp.connect(comp);
  const mestre = ac.createGain(); mestre.gain.setValueAtTime(0.95, 0); mestre.gain.setValueAtTime(0.95, dur - 1.4); mestre.gain.linearRampToValueAtTime(0, dur); mestre.connect(lp);
  const rev = ac.createConvolver(), ir = ac.createBuffer(2, sr * 2.6, sr), r = rng(123);
  for (let c = 0; c < 2; c++) { const dd = ir.getChannelData(c); for (let i = 0; i < dd.length; i++) dd[i] = (r() * 2 - 1) * Math.pow(1 - i / dd.length, 3); }
  rev.buffer = ir; const revG = ac.createGain(); revG.gain.value = 0.3; rev.connect(revG); revG.connect(mestre);
  const bus = ac.createGain(); bus.connect(mestre); bus.connect(rev);
  const m2f = (n) => 440 * Math.pow(2, (n - 69) / 12);
  function nota(t0, f, durN, vol, tipo = 'sine') {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0008, t0 + durN);
    o.connect(g); g.connect(bus); o.start(t0); o.stop(t0 + durN + 0.05);
  }
  const piano = (t0, n, vol, durN) => { const f = m2f(n); nota(t0, f, durN, vol); nota(t0, f * 2, durN * 0.5, vol * 0.22); nota(t0, f * 3, durN * 0.25, vol * 0.07); };
  function pad(t0, t1, n, vol) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = m2f(n);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.8); g.gain.setValueAtTime(vol, Math.max(t0 + 0.8, t1 - 0.5)); g.gain.linearRampToValueAtTime(0, t1);
    o.connect(g); g.connect(bus); o.start(t0); o.stop(t1 + 0.05);
  }
  ACORDES.forEach(([ini, notas, baixo], i) => {
    let fim = i + 1 < ACORDES.length ? ACORDES[i + 1][0] : dur;
    if (ini < 37.6 && fim > 37.6) fim = 37.6;
    pad(ini, fim, baixo, 0.05); notas.forEach((n) => pad(ini, fim, n, 0.011));
    const B = ini >= 29.6, passo = B ? 0.395 : 0.79, padrao = [0, 1, 2, 3, 2, 1];
    if (ini >= 42.2) { notas.concat([76]).forEach((n, k) => piano(ini + k * 0.05, n + 12, 0.09, 2.6)); return; }
    let k = 0; for (let tt = ini; tt < fim - 0.05; tt += passo, k++) piano(tt, notas[padrao[k % 6]] + 12, B ? 0.085 : 0.07, B ? 1.3 : 2.2);
  });
  const sino = (t0, f, v) => { nota(t0, f, 1.5, v); nota(t0, f * 2.01, 0.7, v * 0.3); };
  [[16.95, 1318.5], [17.6, 1174.7], [18.35, 1046.5]].forEach(([t0, f]) => sino(t0, f, 0.09));
  [21.3, 21.95, 22.9, 26.1].forEach((t0) => sino(t0, 1568, 0.05));
  sino(38.32, 1046.5, 0.08); sino(38.32, 2093, 0.05);
  // sopro de papel nas transições
  const ruido = ac.createBuffer(1, sr, sr), rr = rng(7), nd = ruido.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = rr() * 2 - 1;
  [5.3, 12.25, 20.6, 29.2, 37.4].forEach((t0) => {
    const s = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = ruido;
    bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(600, t0); bp.frequency.exponentialRampToValueAtTime(3200, t0 + 0.5);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.09, t0 + 0.2); g.gain.linearRampToValueAtTime(0, t0 + 0.6);
    s.connect(bp); bp.connect(g); g.connect(mestre); s.start(t0); s.stop(t0 + 0.7);
  });
  const buf = await ac.startRendering();
  return wavBase64(buf);
}

function wavBase64(buf) {
  const canais = buf.numberOfChannels, n = buf.length, bytes = 44 + n * canais * 2;
  const v = new DataView(new ArrayBuffer(bytes));
  const s = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  s(0, 'RIFF'); v.setUint32(4, bytes - 8, true); s(8, 'WAVE'); s(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, canais, true); v.setUint32(24, buf.sampleRate, true);
  v.setUint32(28, buf.sampleRate * canais * 2, true); v.setUint16(32, canais * 2, true); v.setUint16(34, 16, true);
  s(36, 'data'); v.setUint32(40, n * canais * 2, true);
  const dados = []; for (let c = 0; c < canais; c++) dados.push(buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < canais; c++) { v.setInt16(o, limita(dados[c][i], -1, 1) * 32767, true); o += 2; }
  const u8 = new Uint8Array(v.buffer); let bin = '';
  for (let i = 0; i < u8.length; i += 32768) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
  return btoa(bin);
}

// só expõe seek depois que as fotos e as fontes carregaram, pro render não fotografar quadro incompleto
(async () => {
  for (const [k, src] of Object.entries(window.IMG_SRC)) { const im = new Image(); im.src = src; await im.decode(); IMG[k] = im; }
  await Promise.all([document.fonts.load('700 80px Caladea'), document.fonts.load('800 54px Inter'), document.fonts.load('500 23px Inter')]);
  window.STORYBOARD = STORYBOARD; window.trilha = trilha; window.definirEscala = definirEscala;
  window.seek = (t) => desenha(limita(t, 0, CONFIG.duracao - 1 / CONFIG.fps));
  window.CONFIG = CONFIG;
  if (new URLSearchParams(location.search).has('render')) { desenha(0); return; }
  let pausado = false, base = performance.now(), ultimo = 0;
  tela.addEventListener('click', () => { pausado = !pausado; base = performance.now() - ultimo * 1000; });
  (function laco(agora) {
    if (!pausado) { ultimo = ((agora - base) / 1000) % CONFIG.duracao; desenha(ultimo); }
    requestAnimationFrame(laco);
  })(performance.now());
})();
